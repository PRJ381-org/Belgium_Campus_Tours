[/Script/Engine.RendererSettings]
r.DistanceFields=0

; r.Mobile.AllowFramebufferFetch=1 reverts the mobile deferred renderer from multi-pass to single-pass/Vulkan subpasses, which was the default before UE 5.7.
; Multi-pass deferred is disabled for VR Template for 5.7.1 due to rendering issues with mobile multi-view.
r.Mobile.AllowFramebufferFetch=1

[SystemSettings]
; MSAA off for the Mali-G68 MP4 on the SM-A336E. At the project default of 3 the 4x MSAA resolve
; produced the visible frame drag. [SystemSettings] is applied with ECVF_SetBySystemSettingsIni,
; which outranks the ECVF_SetByProjectSetting used by r.Mobile.AntiAliasing=3 in DefaultEngine.ini
; (see the section-to-priority table in ConsoleManager.cpp). This replaces the device-side
; -ExecCmds="r.Mobile.AntiAliasing 0" UECommandLine.txt workaround, which adb uninstall wipes.
r.Mobile.AntiAliasing=0
