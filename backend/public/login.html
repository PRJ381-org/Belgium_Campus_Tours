<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — PRJ381 Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card panel">
      <div class="login-brand">
        <img src="assets/logo.png" alt="Belgium Campus" class="brand-logo" />
        <div>
          <h1>Virtual Campus Open Day</h1>
          <span class="brand-subtitle">Admin Dashboard</span>
        </div>
      </div>

      <div id="login-error" class="error-banner" style="display: none;"></div>

      <button id="btn-ms-login" class="btn-ms-signin" type="button">
        <svg width="18" height="18" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
          <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
          <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
          <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
        </svg>
        <span>Sign in with Microsoft</span>
      </button>
      <p id="ms-disabled-note" class="login-note" style="display: none;">
        Microsoft sign-in isn't configured yet — pending App Registration approval.
      </p>

      <div class="login-divider"><span>or</span></div>

      <form id="local-login-form" class="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username" />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />

        <button type="submit" class="btn-refresh login-submit">Sign in</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
